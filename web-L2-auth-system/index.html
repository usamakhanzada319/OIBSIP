<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Auth System</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Theme Toggle -->
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>

      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <div class="logo">🔐</div>
          <h1>Welcome Back</h1>
          <p>Sign in to your account to continue</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" autocomplete="off">
          <!-- Username/Email -->
          <div class="form-group">
            <label for="loginIdentifier">Username or Email</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input
                type="text"
                id="loginIdentifier"
                placeholder="Enter username or email"
                required
              />
            </div>
            <span class="error-text" id="loginIdentifierError"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('loginPassword')"
                aria-label="Toggle password visibility"
              >
                <i class="fas fa-eye" id="toggleIcon"></i>
              </button>
            </div>
            <span class="error-text" id="loginPasswordError"></span>
          </div>

          <!-- Remember Me -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Error Message -->
          <div id="loginError" class="auth-error hidden">
            <i class="fas fa-exclamation-circle"></i>
            <span id="loginErrorMessage">Invalid credentials</span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="loginBtn">
            <span id="loginBtnText">Sign In</span>
            <span id="loginBtnLoader" class="loader hidden"></span>
          </button>
        </form>

        <!-- Register Link -->
        <div class="auth-footer">
          <p>Don't have an account? <a href="register.html">Create one</a></p>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <i class="fas fa-check-circle" id="toastIcon"></i>
      <span id="toastMessage">Success!</span>
    </div>

    <script src="app.js"></script>
  </body>
</html>
