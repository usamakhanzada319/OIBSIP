<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Auth System</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container dashboard-container">
      <!-- Theme Toggle -->
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>

      <!-- Dashboard Content -->
      <div class="dashboard-card">
        <!-- Header -->
        <div class="dashboard-header">
          <div>
            <h1>📊 Dashboard</h1>
            <p id="welcomeMessage" class="welcome-text">
              Welcome back, <span id="usernameDisplay">User</span>!
            </p>
          </div>
          <button id="logoutBtn" class="btn btn-danger">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
          <div class="stat-card">
            <div
              class="stat-icon"
              style="background: rgba(99, 102, 241, 0.15); color: #6366f1"
            >
              <i class="fas fa-user"></i>
            </div>
            <div>
              <p class="stat-value" id="statUsers">0</p>
              <p class="stat-label">Total Users</p>
            </div>
          </div>
          <div class="stat-card">
            <div
              class="stat-icon"
              style="background: rgba(34, 197, 94, 0.15); color: #22c55e"
            >
              <i class="fas fa-user-check"></i>
            </div>
            <div>
              <p class="stat-value" id="statActive">0</p>
              <p class="stat-label">Active Users</p>
            </div>
          </div>
          <div class="stat-card">
            <div
              class="stat-icon"
              style="background: rgba(245, 158, 11, 0.15); color: #f59e0b"
            >
              <i class="fas fa-calendar"></i>
            </div>
            <div>
              <p class="stat-value" id="statToday">0</p>
              <p class="stat-label">Today's Logins</p>
            </div>
          </div>
        </div>

        <!-- Activity Section -->
        <div class="activity-section">
          <h2>Recent Activity</h2>
          <div class="activity-list">
            <div class="activity-item">
              <div>
                <p class="activity-text">You logged in</p>
                <p class="activity-time" id="loginTime">Just now</p>
              </div>
            </div>
            <div class="activity-item">
              <div>
                <p class="activity-text">Account secured</p>
                <p class="activity-time">Using SHA-256 encryption</p>
              </div>
            </div>
          </div>
        </div>

        <!-- User Info -->
        <div class="user-info-section">
          <h2>Account Information</h2>
          <div class="user-info-grid">
            <div class="info-item">
              <span class="info-label">Username</span>
              <span class="info-value" id="infoUsername">-</span>
            </div>
            <div class="info-item">
              <span class="info-label">Email</span>
              <span class="info-value" id="infoEmail">-</span>
            </div>
            <div class="info-item">
              <span class="info-label">Member Since</span>
              <span class="info-value" id="infoJoined">-</span>
            </div>
            <div class="info-item">
              <span class="info-label">Account Status</span>
              <span class="info-value status-badge active">Active</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
