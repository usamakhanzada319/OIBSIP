<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert between Celsius, Fahrenheit & Kelvin</p>

        <div class="converter-box">
          <!-- input section -->
          <div class="input-group">
            <label for="tempInput">Enter Temperature</label>
            <input
              type="number"
              id="tempInput"
              placeholder="e.g., 25"
              step="any"
            />
            <span class="error-msg" id="errorMsg"></span>
          </div>

          <!-- unit selector -->

          <div class="input-group">
            <label>Select Input Unit</label>
            <div class="radio-group">
              <label>
                <input type="radio" name="unit" value="celsius" checked />
                °C (Celsius)
              </label>
              <label>
                <input type="radio" name="unit" value="fahrenheit" />
                °F (Fahrenheit)
              </label>

              <label>
                <input type="radio" name="unit" value="kelvin" />
                K (Kelvin)
              </label>
            </div>
          </div>

          <!-- convert button -->

          <button id="convertBtn">Convert</button>

          <!-- result display -->

          <div class="result-box" id="resultBox">
            <div class="result-item">
              <span class="result-label">Celsius</span>
              <span class="result-value" id="celsiusResult">--</span>
            </div>

            <div class="result-item">
              <span class="result-label">Fahrenheit</span>
              <span class="result-value" id="fahrenheitResult">--</span>
            </div>

            <div class="result-item">
              <span class="result-label">Kelvin</span>
              <span class="result-value" id="kelvinResult">--</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
